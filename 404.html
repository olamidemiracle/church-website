<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0f1b2d" />
    <title>Page Not Found</title>
    <meta name="description" content="Sorry, we couldn't find that page." />
    <meta name="robots" content="noindex" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/global.css" />

    <!-- Bridges Vercel environment variables into the browser (see api/env.js) -->
    <script src="/api/env.js"></script>
    <link rel="stylesheet" href="/src/pages/404/404.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <main id="main-content">
      <section class="section not-found">
        <div class="container">
          <p class="not-found__code">404</p>
          <h1>Page Not Found</h1>
          <p>
            Sorry, we couldn't find the page you were looking for. It may have moved, or the address
            might be mistyped.
          </p>
          <div class="not-found__actions">
            <a href="/" class="btn btn-primary">Back to Home</a>
            <a href="/contact" class="btn btn-outline">Contact Us</a>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="/src/pages/404/404.js"></script>
  </body>
</html>
