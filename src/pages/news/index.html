<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#450a0a" />
    <title>News &amp; Announcements</title>
    <meta
      name="description"
      content="Stay up to date with the latest news and announcements from our church."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/global.css" />

    <!-- Bridges Vercel environment variables into the browser (see api/env.js) -->
    <script src="/api/env.js"></script>
  </head>
  <body>
    <div id="site-header"></div>

    <main id="main-content">
      <section class="page-header">
        <div class="container">
          <h1 class="page-header__title">News &amp; Announcements</h1>
          <p>What's happening in our church family.</p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div id="news-list" class="card-grid card-grid--3" aria-live="polite">
            <div class="state-message">
              <div class="state-spinner" role="status" aria-label="Loading news"></div>
              Loading news…
            </div>
          </div>

          <div class="load-more-wrap" id="load-more-wrap" hidden>
            <button type="button" class="btn btn-outline" id="load-more-btn">Load More</button>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="/src/pages/news/news.js"></script>
  </body>
</html>
