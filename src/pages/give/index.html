<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#450a0a" />
    <title>Give</title>
    <meta name="description" content="Support the ministry of our church through online giving." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/global.css" />

    <!-- Bridges Vercel environment variables into the browser (see api/env.js) -->
    <script src="/api/env.js"></script>
    <link rel="stylesheet" href="/src/pages/give/give.css" />

    <!-- Paystack Inline checkout SDK -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
  </head>
  <body>
    <div id="site-header"></div>

    <main id="main-content">
      <section class="hero">
        <div class="container">
          <span class="hero__eyebrow">Give</span>
          <h1 class="hero__title">Give with a Generous Heart</h1>
          <p class="hero__subtitle">
            Your giving supports our ministries, our community outreach, and the ongoing work of
            this church. Thank you for partnering with us.
          </p>
        </div>
      </section>

      <section class="section">
        <div class="container form-page-wrap">
          <div class="card">
            <div id="give-status"></div>

            <form id="give-form" novalidate>
              <div class="form-field">
                <label class="form-label">Amount (₦)</label>
                <div class="amount-presets" id="amount-presets">
                  <button type="button" class="amount-preset-btn" data-amount="1000">₦1,000</button>
                  <button type="button" class="amount-preset-btn" data-amount="5000">₦5,000</button>
                  <button type="button" class="amount-preset-btn" data-amount="10000">
                    ₦10,000
                  </button>
                  <button type="button" class="amount-preset-btn" data-amount="25000">
                    ₦25,000
                  </button>
                </div>
                <input
                  class="form-input"
                  type="number"
                  id="give-amount"
                  name="amount"
                  min="100"
                  step="1"
                  placeholder="Or enter a custom amount"
                  required
                />
                <span class="form-error-text" id="give-amount-error"></span>
              </div>

              <div class="form-row">
                <div class="form-field">
                  <label class="form-label" for="give-name">Full Name</label>
                  <input
                    class="form-input"
                    type="text"
                    id="give-name"
                    name="name"
                    autocomplete="name"
                    required
                  />
                  <span class="form-error-text" id="give-name-error"></span>
                </div>
                <div class="form-field">
                  <label class="form-label" for="give-email">Email Address</label>
                  <input
                    class="form-input"
                    type="email"
                    id="give-email"
                    name="email"
                    autocomplete="email"
                    required
                  />
                  <span class="form-error-text" id="give-email-error"></span>
                </div>
              </div>

              <p class="text-sm" style="margin-bottom: var(--space-5)">
                You'll be securely redirected to complete your payment. This is a one-time gift;
                recurring giving is not yet available.
              </p>

              <button type="submit" class="btn btn-accent" id="give-submit-btn">Give Now</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="/src/pages/give/give.js"></script>
  </body>
</html>
