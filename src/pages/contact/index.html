<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <meta name="description" content="Get in touch — we'd love to hear from you." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/global.css" />

    <!-- Bridges Vercel environment variables into the browser (see api/env.js) -->
    <script src="/api/env.js"></script>
    <link rel="stylesheet" href="/src/pages/contact/contact.css" />

    <!-- EmailJS SDK — used only for a best-effort staff notification email;
       the form's real source of truth is the Firestore write. -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  </head>
  <body>
    <div id="site-header"></div>

    <main id="main-content">
      <section class="page-header">
        <div class="container">
          <h1 class="page-header__title">Contact Us</h1>
          <p>Questions, prayer needs, or just want to say hello? We'd love to hear from you.</p>
        </div>
      </section>

      <section class="section">
        <div class="container contact-grid">
          <div class="card contact-info" id="contact-info">
            <div class="state-message">
              <div class="state-spinner" role="status" aria-label="Loading contact details"></div>
            </div>
          </div>

          <div class="card contact-form-wrapper">
            <div id="contact-form-status"></div>

            <form id="contact-form" novalidate>
              <div class="form-field">
                <label class="form-label" for="contact-name">Full Name</label>
                <input
                  class="form-input"
                  type="text"
                  id="contact-name"
                  name="name"
                  autocomplete="name"
                  required
                />
                <span class="form-error-text" id="contact-name-error"></span>
              </div>

              <div class="form-field">
                <label class="form-label" for="contact-email">Email Address</label>
                <input
                  class="form-input"
                  type="email"
                  id="contact-email"
                  name="email"
                  autocomplete="email"
                  required
                />
                <span class="form-error-text" id="contact-email-error"></span>
              </div>

              <div class="form-field">
                <label class="form-label" for="contact-subject">Subject</label>
                <input
                  class="form-input"
                  type="text"
                  id="contact-subject"
                  name="subject"
                  required
                />
                <span class="form-error-text" id="contact-subject-error"></span>
              </div>

              <div class="form-field">
                <label class="form-label" for="contact-message">Message</label>
                <textarea
                  class="form-textarea"
                  id="contact-message"
                  name="message"
                  required
                ></textarea>
                <span class="form-error-text" id="contact-message-error"></span>
              </div>

              <!-- Honeypot: hidden from real users, often filled in by bots -->
              <div class="form-honeypot" aria-hidden="true">
                <label for="contact-website">Leave this field empty</label>
                <input
                  type="text"
                  id="contact-website"
                  name="website"
                  tabindex="-1"
                  autocomplete="off"
                />
              </div>

              <button type="submit" class="btn btn-primary" id="contact-submit-btn">
                Send Message
              </button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="/src/pages/contact/contact.js"></script>
  </body>
</html>
